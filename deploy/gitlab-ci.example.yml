# ------------------------------------------------------------
# BORRADOR de CI/CD para GitLab.
# Copiar a .gitlab-ci.yml cuando el repo esté en GitLab.
#
# Variables protegidas/masked esperadas:
#   CAPROVER_URL    https://captain.server.brobert.net
#   CAPROVER_APP    patrulla-staging
#   CAPROVER_TOKEN  token de deploy de la app (no la password del dashboard)
#
# La imagen es agnóstica al entorno: config.js se genera al arrancar el
# contenedor con SUPABASE_URL y SUPABASE_ANON_KEY, configuradas en CapRover.
# ------------------------------------------------------------

stages:
  - verify
  - package
  - deploy
  - smoke

default:
  interruptible: true

verify:
  stage: verify
  image: node:22-alpine
  script:
    - node --check scripts/build.mjs
    - node scripts/build.mjs
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

package:
  stage: package
  image: docker:27.4.1
  services:
    - docker:27.4.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
  needs: ["verify"]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:staging:
  stage: deploy
  image: node:22-alpine
  needs: ["package"]
  before_script:
    - npm install -g caprover
  script:
    - caprover deploy --caproverUrl "$CAPROVER_URL" --caproverApp "$CAPROVER_APP" --appToken "$CAPROVER_TOKEN" --imageName "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  environment:
    name: staging
    url: https://patrulla-staging.server.brobert.net
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

smoke:staging:
  stage: smoke
  image: curlimages/curl:8.10.1
  needs: ["deploy:staging"]
  script:
    - sh deploy/smoke.sh https://patrulla-staging.server.brobert.net
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

