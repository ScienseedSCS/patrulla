# Patrulla Antimosquito · nginx para el contenedor de staging/producción
# Sirve únicamente archivos estáticos. No hay proxy a Supabase: el navegador
# habla directo con Supabase.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    autoindex off;

    # Las fotos se suben directo a Supabase Storage, no pasan por este nginx.
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Cabeceras de seguridad. Se heredan en todas las locations mientras
    # no se use otro `add_header` dentro de ellas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    add_header X-Frame-Options "DENY" always;
    # Staging no debe indexarse. Quitar si este nginx se usa en producción indexable.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Health check para CapRover / balanceadores.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Documento principal y páginas que deben revalidarse siempre.
    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /admin.html {
        expires -1;
        try_files $uri =404;
    }

    location = /admin-reportes.html {
        expires -1;
        try_files $uri =404;
    }

    location = /config.js {
        expires -1;
        try_files $uri =404;
    }

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires -1;
        try_files $uri =404;
    }

    location = /build-info.json {
        expires -1;
        try_files $uri =404;
    }

    # Assets estáticos: cache corta. Si más adelante se hashean los nombres,
    # se puede subir a 1 año + immutable.
    location ~* \.(?:css|js|woff2|png|jpe?g|svg|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    # No servir dotfiles (.git, .env, etc.). Se permite .well-known.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
