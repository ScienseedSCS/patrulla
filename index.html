<!-- =====================================================================
     PATRULLA ANTIMOSQUITO · Solapa "Aprender" (revisión Manuel)
     Fragmento autocontenido: pegar tal cual donde hoy está el contenido
     de la solapa Aprender. No necesita cambios en el HTML global:
     - Estilos encapsulados (Shadow DOM): no afectan ni son afectados por la app.
     - Sin variables ni ids globales; se puede pegar más de una vez sin conflicto.
     - Toma la tipografía de la app (font-family: inherit).

     Atributos opcionales de <pa-aprender>:
       seccion="tips" | "detectar"   → muestra solo esa parte (si la app ya
                                        tiene su propia navegación interna).
                                        Sin atributo: muestra ambas con pestañas.
       img-patio="ruta"              → imagen del patio (sin círculos rojos).
       img-alcantarilla="ruta"       → imagen del balde y la alcantarilla.
     ===================================================================== -->

<pa-aprender img-patio="assets/patio.jpg" img-alcantarilla="assets/balde-alcantarilla.jpg"></pa-aprender>

<script>
(() => {
  if (customElements.get("pa-aprender")) return;

  /* ===================================================================
     PUNTOS QUE LA APP YA TIENE EN EL PATIO
     Copiar acá los existentes para que no se pierdan.
     Formato: { id, x, y, titulo, texto }  (x, y = centro en % de la imagen;
     opcional r = diámetro en % del ancho, por defecto 13)
     =================================================================== */
  const PUNTOS_EXISTENTES = [
    // { id:"regadera", x:28, y:65, titulo:"Regadera", texto:"..." },
  ];

  /* ===== Contenido nuevo (cambios de la revisión) ===== */
  const TIPS = [
    { grupo: "Agua y criaderos", items: [
      { titulo: "Agua limpia o sucia: las dos sirven de criadero",
        texto: "El mosquito prefiere agua quieta, pero también pone huevos en agua sucia.",
        detalle: [
          "Cámaras sépticas con tapas rotas: los mosquitos entran a poner huevos.",
          "El agua de lluvia es limpia, pero si cae en un recipiente con tierra se ensucia y los huevos pegados en las paredes igual se abren.",
          "Floreros, platos de macetas y tapitas también son criaderos."
        ] }
    ]},
    { grupo: "Criaderos y descacharrado", items: [
      { titulo: "Una acción, cuatro protecciones",
        texto: "Cada recipiente que lavás y guardás bajo techo, o que tirás si no lo usás, reduce el riesgo de las cuatro arbovirosis.",
        detalle: [
          "¿Lo usás? Lavalo, cepillá las paredes para sacar los huevos y guardalo bajo techo.",
          "¿No lo usás? Eliminalo.",
          "Darlo vuelta no alcanza: en pocos días puede volver a quedar boca arriba."
        ] }
    ]},
    { grupo: "Comunidad", items: [
      { titulo: "Contagiá a tus vecinos",
        texto: "Mostrales las acciones recomendadas y sumen a la manzana para que el barrio quede libre de criaderos." }
    ]},
    { grupo: "Según la época", items: [
      { titulo: "Verano, alerta máxima",
        texto: "Con calor y lluvia el mosquito se reproduce más rápido. Redoblá la vigilancia." },
      { titulo: "Invierno y primavera, momento de descacharrar",
        texto: "Casi no hay mosquitos adultos, pero hay muchos recipientes con huevos esperando el calor. Es el mejor momento para eliminarlos y descacharrar." }
    ]}
  ];

  const PUNTOS_NUEVOS = [
    { id:"balde", x:11, y:63, titulo:"Balde con agua",
      texto:"Baldes y recipientes que juntan agua: si los usás, lavalos y guardalos bajo techo; si no, eliminalos." },
    { id:"bebedero", x:70, y:34, titulo:"Bebedero del perro",
      texto:"Cambiá el agua y lavá el recipiente cepillando las paredes cada 2 o 3 días." },
    { id:"pileta", x:87, y:68, titulo:"Pileta inflable",
      texto:"Las piletas de goma o inflables juntan mucha agua. Si no se usa, vaciala, secala y guardala bajo techo." },
    { id:"juguetes", x:61, y:83, titulo:"Juguetes en el patio",
      texto:"Juntan agua cuando llueve y quedan días tirados. Guardalos después de jugar." }
  ];

  const PATIO2 = [
    { x:20, y:26, titulo:"Balde con agua: criadero",
      texto:"Lavalo cepillando las paredes y guardalo bajo techo, o eliminalo si no lo usás." },
    { x:61, y:65, titulo:"Alcantarilla o caja de agua: criadero",
      texto:"Los mosquitos entran a poner huevos. Para evitarlo:",
      lista:["Colocá una malla mosquitera sobre la rejilla.",
             "Echá agua hirviendo una o dos veces por semana para eliminar huevos y larvas."] }
  ];

  /* Une existentes + nuevos sin duplicar ids (si un id ya existe, gana el existente) */
  const PATIO = [...PUNTOS_EXISTENTES];
  PUNTOS_NUEVOS.forEach(p => { if (!PATIO.some(e => e.id === p.id)) PATIO.push(p); });

  const CSS = `
    :host{display:block;font-family:inherit;color:#2a1426;line-height:1.45;
      --card:#fbf8f3;--panel:#efe4d6;--ink:#2a1426;--muted:#7a6a72;--line:#e2d4c3;--risk:#c0392b;--focus:#7b3fa0}
    *{box-sizing:border-box}
    .tabs{display:flex;gap:.5rem;margin-bottom:1rem}
    .tabs button{flex:1;font:inherit;font-weight:700;padding:.55rem .75rem;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
    .tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
    button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    [hidden]{display:none!important}
    .grupo{margin-bottom:1.1rem}
    .grupo h2{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:0 0 .5rem .25rem}
    .tip,.juego{background:var(--card);border:1px solid var(--line);border-radius:14px}
    .tip{padding:.85rem 1rem;margin-bottom:.6rem}
    .tip h3{font-size:.98rem;font-weight:700;margin:0 0 .2rem}
    .tip p{font-size:.88rem;color:var(--muted);margin:0}
    details{margin-top:.5rem;font-size:.85rem}
    summary{cursor:pointer;font-weight:700}
    ul{margin:.4rem 0 0;padding-left:1.1rem}
    .tip ul{color:var(--muted)}
    li{margin-bottom:.25rem}
    .juego{padding:1rem;margin-bottom:1rem}
    .juego h2{font-size:1.05rem;margin:0 0 .25rem}
    .sub{font-size:.88rem;color:var(--muted);margin:0 0 .75rem}
    .escena{position:relative;border-radius:10px;overflow:hidden;background:var(--line)}
    .escena img{display:block;width:100%;height:auto}
    .hotspot{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;border-radius:50%;border:3px solid transparent;background:transparent;cursor:pointer;padding:0}
    .hotspot.ok{border-color:var(--risk);background:rgba(192,57,43,.15)}
    .marcador{position:absolute;transform:translate(-50%,-50%);width:2.4rem;height:2.4rem;border-radius:50%;background:var(--risk);color:#fff;font:inherit;font-size:1.3rem;font-weight:800;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
    .contador{display:flex;justify-content:space-between;align-items:center;margin-top:.6rem;font-size:.88rem;font-weight:700}
    .contador button{font:inherit;font-size:.8rem;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer}
    .feedback{margin-top:.6rem;border-left:4px solid var(--risk);padding:.6rem .8rem;background:var(--panel);border-radius:0 10px 10px 0;font-size:.88rem;min-height:3rem}
    .feedback strong{display:block;margin-bottom:.15rem}
  `;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fbHTML = i => `<strong>${esc(i.titulo)}</strong>${esc(i.texto)}${i.lista ? `<ul>${i.lista.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>` : ""}`;

  class PaAprender extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const root = this.attachShadow({ mode: "open" });
      const seccion = this.getAttribute("seccion");
      const imgPatio = this.getAttribute("img-patio") || "assets/patio.jpg";
      const imgAlc = this.getAttribute("img-alcantarilla") || "assets/balde-alcantarilla.jpg";
      const verTips = seccion !== "detectar", verDet = seccion !== "tips", conTabs = !seccion;

      root.innerHTML = `
        <style>${CSS}</style>
        ${conTabs ? `<div class="tabs" role="tablist">
          <button role="tab" data-p="tips" aria-selected="true">Tips</button>
          <button role="tab" data-p="det" aria-selected="false">Detectar criaderos</button></div>` : ""}
        ${verTips ? `<section data-panel="tips">${TIPS.map(g => `
          <div class="grupo"><h2>${esc(g.grupo)}</h2>${g.items.map(t => `
            <article class="tip"><h3>${esc(t.titulo)}</h3><p>${esc(t.texto)}</p>
            ${t.detalle ? `<details><summary>Ver ejemplos</summary><ul>${t.detalle.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></details>` : ""}
            </article>`).join("")}</div>`).join("")}</section>` : ""}
        ${verDet ? `<section data-panel="det" ${conTabs ? "hidden" : ""}>
          <div class="juego">
            <h2>Encontrá los criaderos del patio</h2>
            <p class="sub">Tocá cada lugar donde se puede juntar agua.</p>
            <div class="escena" data-e="patio"><img src="${esc(imgPatio)}" alt="Patio de una casa con plantas, juguetes, pileta inflable, balde y bebedero del perro"></div>
            <div class="contador"><span data-c></span><button type="button" data-r>Reiniciar</button></div>
            <div class="feedback" data-f="patio" aria-live="polite"></div>
          </div>
          <div class="juego">
            <h2>¿Dónde pone huevos el mosquito?</h2>
            <p class="sub">Tocá cada marca para saber qué hacer.</p>
            <div class="escena" data-e="alc"><img src="${esc(imgAlc)}" alt="Balde con agua y una rejilla de desagüe en el piso del patio"></div>
            <div class="feedback" data-f="alc" aria-live="polite">Los dos son criaderos. Tocá cada uno.</div>
          </div></section>` : ""}`;

      if (conTabs) root.querySelectorAll('[role="tab"]').forEach(tab => tab.addEventListener("click", () => {
        root.querySelectorAll('[role="tab"]').forEach(t => {
          const on = t === tab; t.setAttribute("aria-selected", on);
          root.querySelector(`[data-panel="${t.dataset.p}"]`).hidden = !on;
        });
      }));

      if (verDet) { this.#patio(root); this.#alc(root); root.querySelector("[data-r]").onclick = () => this.#patio(root); }
    }

    #patio(root) {
      const esc_ = root.querySelector('[data-e="patio"]'), fb = root.querySelector('[data-f="patio"]'), c = root.querySelector("[data-c]");
      const hechos = new Set();
      esc_.querySelectorAll(".hotspot").forEach(n => n.remove());
      const cuenta = () => c.textContent = `${hechos.size} de ${PATIO.length} encontrados`;
      PATIO.forEach(p => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "hotspot";
        b.style.cssText = `left:${p.x}%;top:${p.y}%;width:${p.r || 13}%`;
        b.setAttribute("aria-label", "Revisar: " + p.titulo);
        b.onclick = () => {
          hechos.add(p.id); b.classList.add("ok");
          fb.innerHTML = fbHTML(p) + (hechos.size === PATIO.length ? "<br><br><strong>¡Encontraste todos los criaderos!</strong>" : "");
          cuenta();
        };
        esc_.appendChild(b);
      });
      fb.textContent = "Buscá recipientes que puedan juntar agua.";
      cuenta();
    }

    #alc(root) {
      const e = root.querySelector('[data-e="alc"]'), fb = root.querySelector('[data-f="alc"]');
      PATIO2.forEach(p => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "marcador"; b.textContent = "!";
        b.style.cssText = `left:${p.x}%;top:${p.y}%`;
        b.setAttribute("aria-label", p.titulo);
        b.onclick = () => fb.innerHTML = fbHTML(p);
        e.appendChild(b);
      });
    }
  }
  customElements.define("pa-aprender", PaAprender);
})();
</script>
